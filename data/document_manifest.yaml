version: 1
school: HUIT
created_for: task_1_2_preprocessing_and_vectorization

policies:
  source_priority:
    current_regulation: 100
    current_guidance: 80
    current_form: 60
    faq: 40
    uncertain_or_legacy: 20
  current_policy:
    default_current_only: true
    allow_legacy_when:
      - user_asks_for_history_or_changes
      - no_current_source_exists_for_topic
    legacy_answer_requirement: warn_user_and_cite_source_status
  review_gate:
    block_vector_upsert_when:
      - requires_ocr
      - extraction_quality_low
      - legal_structure_missing
      - table_structure_uncertain
      - manual_review_required
    allow_vector_upsert_when:
      - extraction_quality_ok
      - manual_review_approved
  citation_requirement:
    include_document_title: true
    include_document_code: true
    include_issued_date: true
    include_page: true
    include_article_clause_point_when_available: true
  table_handling:
    preferred_formats:
      - markdown_table
      - json_rows
    preserve_table_caption: true
    preserve_page_number: true
    manual_review_when_table_detected_in_ocr: true

embedding_benchmark:
  status: planned
  candidates:
    - BAAI/bge-m3
    - intfloat/multilingual-e5-base
    - intfloat/multilingual-e5-large
    - vietnamese-bi-encoder
  metrics:
    - top_1_retrieval_accuracy
    - top_3_retrieval_accuracy
    - correct_article_clause_retrieval
    - correct_form_retrieval
    - current_source_priority
    - local_runtime_cost

critical_rules:
  - rule_id: graduation_classification_5_percent_retake
    document_id: huit_qd_3344_2025
    expected_location_hint: "Dieu 40"
    requirement: "Chunking must keep the graduation classification rule together with the constraint about lowering one classification level when repeated-study credits exceed 5 percent."
    audit_required: true

parser_profiles:
  legal_articles:
    chunk_strategy: article_then_clause
    structure_markers:
      - Chuong
      - Dieu
      - Khoan
      - Diem
    preserve_tables: true
  guidance_steps:
    chunk_strategy: section_then_procedure_step
    structure_markers:
      - numbered_section
      - Buoc
      - Luu y
    preserve_tables: true
  form_docx:
    chunk_strategy: form_summary_and_notes
    keep_blank_fields: false
    generate_preview: true
    preview_formats:
      - markdown
      - html
  faq_jsonl:
    chunk_strategy: one_question_answer_per_chunk
  scanned_legal_pdf:
    chunk_strategy: ocr_then_manual_review_then_legal_articles
    requires_ocr: true
    vector_upsert_before_review: false

